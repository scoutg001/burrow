[package]
name = "burrow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Live node-map for a Pangolin WireGuard mesh"
repository = "https://github.com/scoutg001/burrow"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
